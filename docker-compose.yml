services:
  db:
    image: mariadb:11.4
    container_name: medilab-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-medilab}
      MARIADB_USER: ${DB_USER:-medilab}
      MARIADB_PASSWORD: ${DB_PASSWORD:-medilab}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-medilab}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    container_name: medilab-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medilab-api:latest
    container_name: medilab-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/${DB_DATABASE:-medilab}
      DB_USER: ${DB_USER:-medilab}
      DB_PASSWORD: ${DB_PASSWORD:-medilab}
      DB_DRIVER: ${DB_DRIVER:-org.mariadb.jdbc.Driver}
      APP_UPLOAD_PATH: /app/data
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:4200}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SPRING_MAIL_FROM: Medilab
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_KEYSTORE_PATH: /app/certs/jwt-keystore.p12
      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:-changeit}
      JWT_KEYSTORE_ALIAS: ${JWT_KEYSTORE_ALIAS:-jwt-keypair}
      JWT_KEYSTORE_DNAME: ${JWT_KEYSTORE_DNAME:-CN=medilab, OU=IT, O=Medilab, L=Sevilla, ST=Sevilla, C=ES}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SERVER_PORT: 8080
    volumes:
      - uploads_data:/app/data/uploads
      - jwt_certs:/app/certs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v3/api-docs >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mariadb_data:
  uploads_data:
  jwt_certs:
