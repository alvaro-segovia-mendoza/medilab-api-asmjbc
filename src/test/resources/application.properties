spring.datasource.url=jdbc:h2:mem:medilab-test;MODE=MariaDB;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

spring.main.allow-bean-definition-overriding=true

app.upload-root=${java.io.tmpdir}/medilab-test-uploads
app.public-base-url=http://localhost:4200
app.api-public-base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:4200
app.password-reset.path=/auth/reset-password
app.auth.reset-token-expiration-minutes=30

spring.mail.from=test@medilab.local
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

spring.security.oauth2.client.registration.github.client-id=test-client
spring.security.oauth2.client.registration.github.client-secret=test-secret

jwt.keystore.path=unused-in-tests.p12
jwt.keystore.password=changeit
jwt.keystore.alias=jwt-keypair
jwt.keystore.type=PKCS12

geocoding.nominatim.user-agent=medilab-test/1.0
