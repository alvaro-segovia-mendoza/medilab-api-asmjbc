# Taxonomía i18n del proyecto:
# - api.error.*: errores REST y negocio
# - api.auth.*: mensajes de éxito expuestos por la API
# - validation.*: Bean Validation
# - security.*: seguridad HTTP y autenticación
# - mail.*: correos y textos transaccionales
# - view.*: MVC/flash messages y textos de UI propios
# - spring.security.*: claves reservadas del framework

