# Project i18n taxonomy:
# - api.error.*: REST and business errors
# - api.auth.*: API success messages
# - validation.*: Bean Validation
# - security.*: HTTP security and authentication
# - mail.*: email and transactional copy
# - view.*: MVC/flash messages and UI copy
# - spring.security.*: framework-reserved keys

